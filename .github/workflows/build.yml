name: Build AimbotDemo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ekstrak ZIP & Cari Folder Proyek
        id: setup_project
        run: |
          echo "Daftar isi repository awal:"
          ls -la

          # Jika file ZIP ada, ekstrak secara otomatis
          if [ -f "AimbotDemo.zip" ]; then
            echo "Mengekstrak AimbotDemo.zip..."
            unzip -q AimbotDemo.zip -d extracted_project
          elif [ -f "*.zip" ]; then
            ZIP_FILE=$(ls *.zip | head -n 1)
            echo "Mengekstrak $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d extracted_project
          fi

          echo "Daftar isi setelah ekstrak:"
          ls -la extracted_project || true

          # Cari lokasi settings.gradle atau build.gradle setelah diekstrak
          TARGET_DIR=$(find . -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" \) -exec dirname {} \; | head -n 1)

          if [ -z "$TARGET_DIR" ]; then
            echo "Error: File proyek Android tetap tidak ditemukan setelah diekstrak!"
            exit 1
          fi

          echo "Folder proyek ditemukan di: $TARGET_DIR"
          echo "dir=$TARGET_DIR" >> $GITHUB_OUTPUT

          cd "$TARGET_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Membuat gradlew otomatis..."
            gradle wrapper --gradle-version 8.5
          fi

          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.setup_project.outputs.dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AimbotDemo-debug-apk
          path: ${{ steps.setup_project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
